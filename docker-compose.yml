
services:
  backend:
    build:
      # The repository root: the image also carries mcp_server/ and docs/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: heattransplan-backend
    restart: unless-stopped
    environment:
      # Off by default; AI_ENABLED=1 in .env shows Connect AI and turns on the MCP server.
      AI_ENABLED: ${AI_ENABLED:-0}
      # API keys (backend/app/api_keys.py); unset: no keys, as before.
      API_KEY_SECRET: ${API_KEY_SECRET:-}
      API_KEY_BLOCKLIST: ${API_KEY_BLOCKLIST:-}
      API_KEYS: ${API_KEYS:-}
    # Hardened: read-only except /tmp, no special rights, no way to gain any.
    read_only: true
    # /tmp lives in memory: uploads over 1 MB wait there while a request reads
    # them, and matplotlib keeps its font cache there. Sized, so it cannot
    # take the machine's memory.
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Idles at a few hundred MB; an optimisation of a large site takes about
    # 500 MB more, a COP training run some hundreds. The host (15 GB) also runs
    # the test stack, so one runaway request stops here instead of the machine.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      # Only the trained model and its validity ranges — the modelling data
      # stays off the server entirely.
      - ./models:/app/models:ro
      # Who changed what (app/services/activity_log.py); trims itself at 20 MB.
      - activity_log:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes VITE_* into the bundle at build time, so this is a build
        # arg rather than a runtime environment variable. Empty means the
        # browser calls /api on its own origin and the caddy service below
        # routes it to the backend.
        VITE_API_BASE: ""
    container_name: heattransplan-frontend
    depends_on:
      - backend
    restart: unless-stopped
    # Serves files only: read-only, no special rights but binding its port.
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Serves files only: a little memory and CPU is all it ever needs.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  docs:
    # The documentation site, served at /docs.
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: heattransplan-docs
    restart: unless-stopped
    read_only: true
    tmpfs: [/data, /config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Serves files only: a little memory and CPU is all it ever needs.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    container_name: heattransplan-caddy
    # Certificates live in its volumes; it needs only to bind ports 80 and 443.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Holds up to 50 MB uploads on their way to the backend.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    depends_on:
      - frontend
      - backend
      - docs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      # Set per machine in .env (not in git); unset serves plain http on port 80.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
# IPv6 on the app's own network. Without it docker-proxy answers IPv6
# visitors and passes them on over IPv4, so Caddy sees every one of them as
# the network's gateway (172.18.0.1): one shared rate-limit bucket. With it,
# IPv6 is forwarded by NAT and Caddy sees the visitor's address. Docker picks
# a private (ULA) subnet itself, so stacks from this file do not clash.
# Takes effect once the network is made anew (docker compose down, then up).
networks:
  default:
    enable_ipv6: true

volumes:
  activity_log:
  caddy_data:
  caddy_config:
